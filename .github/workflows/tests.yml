name: Tests

# Se ejecuta en cada pull request y en cada push a main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Estilo (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest --cov=pcmus --cov-report=term-missing
      - name: Validar bots admitidos
        run: python -m pcmus validate --games 10

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      - name: La documentación compila sin avisos
        run: mkdocs build --strict
