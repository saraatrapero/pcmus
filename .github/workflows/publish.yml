name: Torneo y web

# Juega el torneo con todos los bots, actualiza la clasificación y publica la
# web en GitHub Pages. Se lanza al fusionar en main, cada lunes y a mano.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      games:
        description: "Partidas por pareja"
        default: "20"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Torneo
        run: python -m pcmus tournament --games "${{ github.event.inputs.games || '20' }}" --out results
      - name: Guardar la clasificación en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git diff --cached --quiet || git commit -m "Clasificación actualizada [skip ci]"
          git push || echo "No se pudo guardar (rama protegida): la web se publica igualmente."
      - name: Generar la web
        run: python scripts/build_web.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: tournament
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
