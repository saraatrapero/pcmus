[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pcmus"
version = "0.1.0"
description = "Mus a dos: motor de juego, API de bots y torneo automático."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Equipo PC Mus" }]
keywords = ["mus", "cartas", "baraja española", "ia", "bots", "torneo"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[project.scripts]
pcmus = "pcmus.cli:main"

[project.urls]
Repository = "https://github.com/saraatrapero/pcmus"
Documentation = "https://pcmus.readthedocs.io"

[tool.hatch.build.targets.wheel]
packages = ["src/pcmus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["node_modules", "public", "server", "_site", "site"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
ignore = ["E501", "B027"]  # líneas largas: las gestiona ruff format; hooks vacíos a propósito
